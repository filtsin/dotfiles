[general]

[font]
size = 14.0

[window]
padding = { x = 0, y = 0 }

[font.normal]
family = "JetBrains Mono"

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
foreground = "#c0b9af"
background = "#1d1a17"

[colors.normal]
black   = "#292623"
red     = "#c47772"
green   = "#91a17d"
yellow  = "#c6a574"
blue    = "#8995a2"
magenta = "#a18bb5"
cyan    = "#83aaa0"
white   = "#c8c0b5"

[colors.bright]
black   = "#625b53"
red     = "#d18a83"
green   = "#a2b18d"
yellow  = "#d3b586"
blue    = "#9ba6b2"
magenta = "#b19bc4"
cyan    = "#96b9af"
white   = "#ddd4c8"

[colors.selection]
text = "CellForeground"
background = "#39312b"
