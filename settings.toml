config_version = 14

[backdrop]
blur_intensity = 0.10999999940395355

[bar]
order = [ "default" ]

    [bar.default]
    end = [
        "tray",
        "notifications",
        "media",
        "clipboard",
        "keyboard_layout",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery"
    ]
    margin_edge = 7
    scale = 1.2000000476837158
    start = [ "control-center", "workspaces", "ram", "temp", "cpu" ]
    widget_spacing = 10

        [bar.default.monitor.HDMI-A-2]
        end = [ "notifications", "tray", "media", "clipboard", "keyboard_layout" ]
        start = [ "control-center", "workspaces" ]

[calendar]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
enabled = false

[dock]
active_monitor_only = true
background_opacity = 0.0
cross_axis_padding = 4
enabled = true
icon_size = 24
item_spacing = 4
magnification_scale = 1.1000000014901161
main_axis_padding = 8
margin_edge = 5
padding = 0
position = "left"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@winit", "lockscreen-login-box@HDMI-A-2", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 540.0
    cy = 1738.0
    output = "HDMI-A-2"
    placement_height = 1920.0
    placement_width = 1080.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 810.0
    cx = 621.0
    cy = 1899.0
    output = "winit"
    placement_height = 2081.0
    placement_width = 1241.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "JetBrains Mono"
password_style = "random"
polkit_agent = true
settings_show_advanced = true
telemetry_enabled = false
ui_scale = 1.2999999523162842

    [shell.panel]
    open_near_click_control_center = true

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    enabled = false
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Rosé Pine"
community_palette = "Cream"

    [theme.templates]
    builtin_ids = [ "niri" ]
    community_ids = [ "zed", "telegram" ]
    enable_builtin_templates = false

[wallpaper]
directory = "/home/filtsin/configs/niri"

    [wallpaper.default]
    path = "/home/filtsin/configs/niri/bg.jpg"

    [wallpaper.last]
    path = "/home/filtsin/configs/niri/bg.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/filtsin/configs/niri/bg.jpg"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/filtsin/configs/niri/bg.jpg"

[weather]
address = "Sankt Petersburg"

[widget.1]
glyph = "hanger"
type = "custom_button"

[widget.Openvpn]
glyph = "brand-openvpn"
type = "custom_button"

    [widget.Openvpn.actions]
    left = "exec pkexec openvpn --cd /etc/openvpn --config filtsin.conf"

[widget.bongocat]
audio_spectrum = true
rave_mode = true
scope = "shared"
script = "scripts/bongocat.lua"
tappy_mode = true
type = "scripted"
use_mpris_filter = true

[widget.media]
hide_when_no_media = true
max_length = 130.0
title_scroll = "on_hover"

[widget.notifications]
hide_when_no_unread = true

[widget.sysmon]
show_value = true
stat = "ram_used"
visualization = "none"

[widget.workspaces]
hide_when_empty = true
minimal = true
occupied_color = "outline"